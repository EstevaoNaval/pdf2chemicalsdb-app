services:
  web:
    build:
      context: web
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - bridge-network

  # Serviço do Django (web)
  django-api:
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: "0.6G"
    user: ${DJANGO_API_UID}:${DATA_GID}
    build:
      context: api
      dockerfile: Dockerfile
      args:
        - USER=${DJANGO_API_USER}
        - UID=${DJANGO_API_UID}
        - GID=${DATA_GID}
    restart: unless-stopped
    environment:
      - ENTRYPOINT_PATH=/src/scripts/docker-django-api-entrypoint.sh
    volumes:
      - ${DATA_ROOT_DIR}:${DATA_ROOT_DIR}:rw
      - django-api-logs:/logs # Volume para logs
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    networks:
      - bridge-network
    depends_on:
      - db
      - rabbitmq
      - redis
    logging:
      driver: "json-file" # Default logging driver
      options:
        max-size: "10m" # Limita o tamanho dos logs para 10MB
        max-file: "3" # Mantém no máximo 3 arquivos de log

  django-worker:
    build:
      context: api
      dockerfile: Dockerfile
      args:
        - USER=${DJANGO_WORKER_USER}
        - UID=${DJANGO_WORKER_UID}
        - GID=${DATA_GID}
    restart: unless-stopped
    user: ${DJANGO_WORKER_UID}:${DATA_GID}
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: "4G"
    volumes:
      - ${DATA_ROOT_DIR}:${DATA_ROOT_DIR}:rw
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - ENTRYPOINT_PATH=/src/scripts/docker-django-worker-entrypoint.sh
    networks:
      - bridge-network
    depends_on:
      - rabbitmq
    logging:
      driver: "json-file" # Default logging driver
      options:
        max-size: "10m" # Limita o tamanho dos logs para 10MB
        max-file: "3" # Mantém no máximo 3 arquivos de log

  # Torque clients live here. The Celery worker reaches this service over HTTP.
  torque-gateway:
    build:
      context: api
      dockerfile: torque-gateway/Dockerfile
      args:
        - SVC_PDF2CHEMICALS_PROD_CELERY_WORKER_USER=${SVC_PDF2CHEMICALS_PROD_CELERY_WORKER_USER}
        - SVC_PDF2CHEMICALS_PROD_CELERY_WORKER_UID=${SVC_PDF2CHEMICALS_PROD_CELERY_WORKER_UID}
        - SVC_PDF2CHEMICALS_PROD_CELERY_WORKER_GID=${SVC_PDF2CHEMICALS_PROD_CELERY_WORKER_GID}
        - TORQUE_QUEUE_GID=${TORQUE_QUEUE_GID:?set TORQUE_QUEUE_GID in api/.env}
        - TORQUE_SHA256=${TORQUE_SHA256:-}
    image: pdf2chemicals-torque-gateway:${IMAGE_TAG:-latest}
    hostname: ${TORQUE_GATEWAY_HOSTNAME:?set TORQUE_GATEWAY_HOSTNAME in api/.env}
    init: true
    restart: unless-stopped
    env_file:
      - api/.env
    environment:
      - TORQUE_SERVER=${TORQUE_SERVER}
      - GATEWAY_TOKEN_FILE=/run/secrets/torque_gateway_token
    secrets:
      - torque_gateway_token
    networks:
      bridge-network:
        ipv4_address: ${TORQUE_GATEWAY_IPV4:?set TORQUE_GATEWAY_IPV4 in api/.env}
    extra_hosts:
      - ${TORQUE_SERVER}:${TORQUE_SERVER_IPV4:?set TORQUE_SERVER_IPV4 in api/.env}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health > /dev/null"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Serviço Celery Worker para PDF. Submits jobs through torque-gateway.
  pdf2chemicals-celery-worker:
    build:
      context: api
      dockerfile: Dockerfile
      args:
        - USER=${SVC_PDF2CHEMICALS_PROD_CELERY_WORKER_USER}
        - UID=${SVC_PDF2CHEMICALS_PROD_CELERY_WORKER_UID}
        - GID=${SVC_PDF2CHEMICALS_PROD_CELERY_WORKER_GID}
        - DATA_GROUP=${DATA_GROUP}
        - DATA_GID=${DATA_GID}
    user: ${SVC_PDF2CHEMICALS_PROD_CELERY_WORKER_USER}
    restart: unless-stopped
    hostname: ${SVC_PDF2CHEMICALS_PROD_CELERY_WORKER_HOSTNAME}
    init: true
    stop_grace_period: 120s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: "4G"
    networks:
      bridge-network:
        ipv4_address: ${SVC_PDF2CHEMICALS_PROD_CELERY_WORKER_HOSTNAME_IPV4}
    volumes:
      - ${DATA_ROOT_DIR}:${DATA_ROOT_DIR}:rw
    env_file:
      - api/.env
    environment:
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - ENTRYPOINT_PATH=/src/scripts/docker-pdf2chemicals-celery-entrypoint.sh
      - TORQUE_GATEWAY_URL=http://torque-gateway:8080
      - TORQUE_GATEWAY_TOKEN_FILE=/run/secrets/torque_gateway_token
    secrets:
      - torque_gateway_token
    depends_on:
      rabbitmq:
        condition: service_started
      torque-gateway:
        condition: service_healthy
    logging:
      driver: "json-file" # Default logging driver
      options:
        max-size: "10m" # Limita o tamanho dos logs para 10MB
        max-file: "3" # Mantém no máximo 3 arquivos de log

  db:
    build:
      context: api/db
      dockerfile: Dockerfile
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: "2G"
    networks:
      - bridge-network
    environment:
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_DB: ${DATABASE_NAME}
    env_file:
      - .env
    command: >
      postgres -c port=5477
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5477:5477"
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: "2G"
    networks:
      - bridge-network
    command: >
      redis-server --appendonly yes --requirepass "$REDIS_PASSWORD"
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    env_file:
      - .env
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
    restart: unless-stopped

  # Serviço RabbitMQ (broker de mensagens)
  rabbitmq:
    hostname: rabbitmq
    image: rabbitmq:4-management-alpine
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: "1G"
    networks:
      - bridge-network
    environment:
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbit consumer_timeout 31622400000"
    ports:
      - "127.0.0.1:5672:5672" # Porta padrão do RabbitMQ
      - "127.0.0.1:15672:15672" # Porta para a interface de administração do RabbitMQ
    restart: unless-stopped
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  clam-container:
    container_name: clam-container-01
    image: clamav/clamav:stable_base
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "3G"
    networks:
      - bridge-network
    ports:
      - "127.0.0.1:3310:3310"
      - "127.0.0.1:7357:7357"
    volumes:
      - clamav-data:/var/lib/clamav
      - clamav-logs:/var/log/clamav
    restart: unless-stopped

networks:
  bridge-network:
    driver: bridge
    ipam:
      config:
        - subnet: ${LABSOA_WEBSITE_SUBNET}

secrets:
  torque_gateway_token:
    file: ./secrets/torque_gateway_token

volumes:
  redis-data:
  media:
  clamav-data:
  clamav-logs:
  django-api-logs: # Volume dedicado para logs do Django
  postgres_data:
  rabbitmq_data:
